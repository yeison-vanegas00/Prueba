<div class="task-form-container">
  <h2>{{ isEditMode ? 'Editar tarea' : 'Nueva tarea' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Título -->
    <div class="form-group">
      <label for="titulo">Título <span class="required">*</span></label>
      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        placeholder="Ingrese el título de la tarea"
        maxlength="100"
      />
      <div
        class="error-message"
        *ngIf="tituloControl?.invalid && tituloControl?.touched"
      >
        <span *ngIf="tituloControl?.errors?.['required']">
          El título es obligatorio.
        </span>
        <span *ngIf="tituloControl?.errors?.['maxlength']">
          El título no puede superar los 100 caracteres.
        </span>
      </div>
      <small class="char-count">
        {{ tituloControl?.value?.length ?? 0 }} / 100
      </small>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        rows="4"
        placeholder="Descripción opcional de la tarea"
      ></textarea>
    </div>

    <!-- Error del servidor -->
    <div class="server-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Acciones -->
    <div class="form-actions">
      <button
        type="submit"
        class="btn-primary"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear tarea') }}
      </button>
      <button
        type="button"
        class="btn-secondary"
        (click)="onCancel()"
        [disabled]="isSubmitting"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>

<style>
  .task-form-container {
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    max-width: 560px;
    margin: 0 auto 24px;
  }

  h2 {
    margin-bottom: 20px;
    font-size: 1.3rem;
    color: #2c3e50;
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: #555;
    font-size: 0.9rem;
  }

  .required {
    color: #e74c3c;
  }

  input[type='text'],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
  }

  input[type='text']:focus,
  textarea:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
  }

  .char-count {
    font-size: 0.78rem;
    color: #999;
    display: block;
    text-align: right;
    margin-top: 4px;
  }

  .error-message {
    color: #e74c3c;
    font-size: 0.82rem;
    margin-top: 4px;
  }

  .server-error {
    background: #fdf0ef;
    border: 1px solid #e74c3c;
    border-radius: 4px;
    padding: 10px 14px;
    color: #c0392b;
    font-size: 0.88rem;
    margin-bottom: 16px;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    background-color: #3498db;
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: #2980b9;
  }

  .btn-secondary {
    background-color: #ecf0f1;
    color: #555;
    padding: 10px 20px;
    border-radius: 4px;
  }

  .btn-secondary:hover:not(:disabled) {
    background-color: #d5dbdb;
  }
</style>
