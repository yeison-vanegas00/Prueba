<div style="max-width: 500px; margin: 0 auto 20px; padding: 16px; border: 1px solid #ccc; font-family: Arial, sans-serif;">
  <h2>{{ isEditMode ? 'Editar tarea' : 'Nueva tarea' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <!-- Título -->
    <div style="margin-bottom: 12px;">
      <label for="titulo">Título <span style="color: red;">*</span></label><br>
      <input
        id="titulo"
        type="text"
        formControlName="titulo"
        placeholder="Título de la tarea"
        maxlength="100"
        style="width: 100%; padding: 6px; box-sizing: border-box;"
      />
      <div style="color: red; font-size: 0.85rem;" *ngIf="tituloControl?.invalid && tituloControl?.touched">
        <span *ngIf="tituloControl?.errors?.['required']">El título es obligatorio.</span>
        <span *ngIf="tituloControl?.errors?.['maxlength']">Máximo 100 caracteres.</span>
      </div>
      <small style="color: #888;">{{ tituloControl?.value?.length ?? 0 }} / 100</small>
    </div>

    <!-- Descripción -->
    <div style="margin-bottom: 12px;">
      <label for="descripcion">Descripción</label><br>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        rows="4"
        placeholder="Descripción opcional"
        style="width: 100%; padding: 6px; box-sizing: border-box;"
      ></textarea>
    </div>

    <!-- Error del servidor -->
    <div style="color: red; margin-bottom: 10px;" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- Acciones -->
    <div>
      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear tarea') }}
      </button>
      <button type="button" (click)="onCancel()" [disabled]="isSubmitting" style="margin-left: 8px;">
        Cancelar
      </button>
    </div>
  </form>
</div>
